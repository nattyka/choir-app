<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sopran – øving</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1115;color:#e8e8ec}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:6px 0 4px}
.sub{color:#9aa0ab;font-size:.9rem;margin-bottom:14px}
.song{background:#181b22;border-radius:14px;padding:12px 12px 10px;margin-bottom:12px}
.song h2{font-size:1.05rem;margin:0 0 8px}
audio{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.85rem;color:#9aa0ab}
a{color:#7aa2ff}
.speed{display:flex;gap:6px;align-items:center;margin-bottom:14px;color:#9aa0ab;font-size:.9rem}
.speed button{font:inherit;background:#252a35;color:#e8e8ec;border:1px solid #333a48;border-radius:10px;padding:8px 12px}
.speed button.on{background:#7aa2ff;color:#0b0d12;border:none}
</style>
</head>
<body>
<main>
<h1>🎶 Sopran – øving</h1>
<div class="sub">Your soprano line at the right pitch, with the recording underneath. Each song starts with your first note.</div>
<div class="speed">Speed:
  <button data-r="0.75">Slow</button><button data-r="0.9">Bit slower</button><button data-r="1" class="on">Normal</button>
</div>
<div id="list"></div>
</main>
<script>
const SONGS=[
 ['Ding Dong! Merrily on High','mixes/1_Ding_Dong_Merrily_on_High_sopran.mp3'],
 ['Christmas Lullaby','mixes/2_Christmas_Lullaby_sopran.mp3'],
 ['Nå tennes tusen julelys','mixes/3_Na_tennes_tusen_julelys_sopran.mp3'],
 ['Stjernesludd','mixes/4_Stjernesludd_sopran.mp3'],
 ['Deilig er jorden','mixes/5_Deilig_er_jorden_sopran.mp3'],
 ['What Christmas Means to Me','mixes/6_What_Christmas_Means_to_Me_sopran.mp3'],
 ['Nordnorsk julesalme (original recording)','songs/Nordnorsk_julesalme_sopran.mp3']];
let rate=1;
const list=document.getElementById('list');
SONGS.forEach(([t,u])=>{const d=document.createElement('div');d.className='song';
  d.innerHTML='<h2>'+t+'</h2><audio controls preload="metadata" src="'+u+'"></audio><div class="row"><span></span><a href="'+u+'" download>⬇︎ Save to phone</a></div>';
  list.appendChild(d);});
const audios=[...document.querySelectorAll('audio')];
audios.forEach(a=>{a.preservesPitch=true;a.addEventListener('play',()=>{a.playbackRate=rate;audios.forEach(o=>{if(o!==a)o.pause();});});});
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;
  document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b));audios.forEach(a=>a.playbackRate=rate);});
</script>
</body>
</html>
